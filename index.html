<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria Huellitas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-primary">Veterinaria Huellitas 🐾</h1>

    <h2 class="mb-4">Registro de mascotas</h2>

    <label>Nombre:</label>
    <input id="nombre" type="text" class="form-control mb-3">

    <label>Especie:</label>
    <select id="especie" class="form-select mb-3">
        <option>Perro</option>
        <option>Gato</option>
    </select>

    <label>Edad:</label>
    <input id="edad" type="number" class="form-control mb-3">

    <button id="registrar" class="btn btn-primary">
        Registrar mascota
    </button>

    <hr>

    <ul id="lista" class="list-group"></ul>

</div>

<script src="app.js"></script>

</body>
</html>
